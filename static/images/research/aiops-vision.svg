<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 616" role="img" aria-labelledby="title desc">
<title id="title">AIOps research vision</title><desc id="desc">Observe distributed services, detect anomalies, diagnose causes, support response, and evaluate with realistic benchmarks. This is a research agenda, not a single deployed system.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#426875"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f5f8fa"/>
<text x="200" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#1e3765">AIOps research vision</text>
<rect x="20" y="52" width="360" height="88" rx="10" fill="white" stroke="#b9cbd1"/>
<text x="200" y="79" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183443">Observe</text>
<text x="200" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183443">Metrics, logs, and traces</text>
<text x="200" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183443">from distributed services</text>
<path d="M200 141V162" stroke="#426875" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="164" width="360" height="88" rx="10" fill="white" stroke="#b9cbd1"/>
<text x="200" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183443">Detect</text>
<text x="200" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183443">Identify anomalous signals</text>
<text x="200" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183443">and unreliable agent behaviour</text>
<path d="M200 253V274" stroke="#426875" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="276" width="360" height="88" rx="10" fill="white" stroke="#b9cbd1"/>
<text x="200" y="303" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183443">Diagnose</text>
<text x="200" y="327" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183443">Connect symptoms to causes</text>
<text x="200" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183443">using dependencies and evidence</text>
<path d="M200 365V386" stroke="#426875" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="388" width="360" height="88" rx="10" fill="white" stroke="#b9cbd1"/>
<text x="200" y="415" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183443">Respond</text>
<text x="200" y="439" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183443">Support incident decisions</text>
<text x="200" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183443">and investigate automated repair</text>
<path d="M200 477V498" stroke="#426875" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="500" width="360" height="88" rx="10" fill="white" stroke="#b9cbd1"/>
<text x="200" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183443">Evaluate</text>
<text x="200" y="551" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183443">Realistic faults and benchmarks</text>
<text x="200" y="574" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183443">Diagnostic and repair quality</text>
</svg>
