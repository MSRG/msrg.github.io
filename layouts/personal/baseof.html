<!doctype html>
<html lang="{{ or site.Language.Locale site.Locale "en-CA" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="kind-{{ .Kind }} section-{{ .Section }} shell-personal">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <nav aria-label="Return to MSRG">
    <a class="personal-home-link" href="{{ "/" | relURL }}" aria-label="Back to the MSRG main site">
      <span class="personal-home-link__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img" focusable="false">
          <path d="M14.5 5.5 8 12l6.5 6.5" />
          <path d="M8.5 12H20" />
        </svg>
      </span>
      <span class="personal-home-link__text">MSRG main site</span>
    </a>
    </nav>
    <main id="main-content" class="personal-main">
      {{ block "main" . }}{{ end }}
    </main>
  </body>
</html>
