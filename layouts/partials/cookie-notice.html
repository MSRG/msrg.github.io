<section class="cookie-notice" aria-label="Cookie notice" data-cookie-notice hidden>
  <div class="cookie-notice__inner">
    <div class="cookie-notice__content">
      <p class="cookie-notice__eyebrow">Cookie Notice</p>
      <p>
        The news feed is provided by Elfsight and may use cookies.
        Your acknowledgment of this notice is saved in this browser.
      </p>
    </div>
    <div class="cookie-notice__actions">
      <a class="button button-secondary cookie-notice__link" href="https://www.utoronto.ca/privacy">UofT Privacy Policy</a>
      <button class="button cookie-notice__accept" type="button" data-cookie-accept>Got it</button>
    </div>
  </div>
</section>
