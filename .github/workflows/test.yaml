name: Test website

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platforms:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install locked environment
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.1
          locked: true

      - name: Verify Hugo
        run: pixi run --locked hugo version

      - name: Test, build, and check links
        run: pixi run --locked check

  validate:
    # Keep this name stable when configuring main's required status checks.
    name: Validate website
    if: always()
    needs: platforms
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform checks to pass
        env:
          PLATFORM_RESULT: ${{ needs.platforms.result }}
        run: test "$PLATFORM_RESULT" = success
